name: Deploy to VPS

on:
  push:
    branches:
      - prod # Workflow chạy khi có code push lên nhánh prod

jobs:
  deploy:
    name: Deploy Next.js App
    runs-on: ubuntu-latest
    
    steps:
      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@master
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL || 'https://api.103.140.249.73.sslip.io' }}
          API_REQUEST_TIMEOUT_MS: ${{ vars.API_REQUEST_TIMEOUT_MS || '10000' }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_PORT }}
          envs: API_BASE_URL,API_REQUEST_TIMEOUT_MS
          script: |
            # Nạp môi trường để nhận diện lệnh npm và pm2 khi SSH (Non-interactive shell)
            export PATH=$PATH:/usr/local/bin:/usr/bin:/bin:/snap/bin
            source ~/.bashrc || true
            source ~/.profile || true
            if [ -s "$HOME/.nvm/nvm.sh" ]; then source "$HOME/.nvm/nvm.sh"; fi
            
            # 1. Di chuyển tới thư mục chứa project trên VPS
            cd vietauction-web/
            
            # 2. Cập nhật code mới nhất
            git pull origin prod
            
            # 3. Cài đặt các gói mới nếu có sự thay đổi trong package.json
            npm install
            
            # 4. Build lại Next.js app cho môi trường production
            npm run build
            
            # 5. Nạp cấu hình backend server-side và reload PM2 với môi trường mới
            pm2 startOrReload ecosystem.config.cjs --update-env
